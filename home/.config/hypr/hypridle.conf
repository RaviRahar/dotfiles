# FIXME:
# Hyprland's old `hyprctl dispatch dpms on/off` syntax was replaced by the
# Lua dispatcher form. The DPMS commands below have been updated.

# TODO:
# Hypridle now has `ignore_wayland_inhibit`. Keeping it false means Wayland
# idle inhibitors (for example video playback) continue to pause listeners.
# ignore_wayland_inhibit = false
#
# TODO:
# Individual listeners can now use `condition_cmd` and `condition_retry`,
# which is useful if you want suspend/hibernate to depend on external state.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# listener {
#     timeout = 150
#     on-timeout = brightnessctl -s set 10
#     on-resume = brightnessctl -r
# }
#
# listener {
#     timeout = 150
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
#     on-resume = brightnessctl -rd rgb:kbd_backlight
# }

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 655
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 660
    on-timeout = systemctl suspend-then-hibernate
}
