# FIXME:
# The old `preload = ...` and `wallpaper = monitor,path` configuration form
# has been removed. The `wallpaper { ... }` special category below is the
# current form, so the legacy duplicate lines have been removed.

# TODO:
# `path` may now point to a directory for wallpaper rotation. If you use a
# directory, `timeout`, `order = random`, and `recursive = true` are available.

wallpaper {
    monitor =
    path = ~/E/Downloads/Wallpapers/abstract1.jpg
    fit_mode = cover
}

splash = false

