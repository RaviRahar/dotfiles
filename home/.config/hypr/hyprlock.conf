# FIXME:
# `no_fade_in`, `no_fade_out`, and `disable_loading_bar` are no longer
# hyprlock config options. Fade behavior is now configured with `animations`.
# Your old `no_fade_* = false` values meant fades were enabled anyway.
#
# `fail_timeout` is now a `general` option, so it has been moved there.

# TODO:
# Hyprlock now has an `animations` section plus `bezier` / `animation`
# keywords if you want custom lock/unlock transitions.
#
# TODO:
# For a blurred snapshot of the live desktop instead of a fixed wallpaper,
# try `path = screenshot` in the background block.

general {
    hide_cursor = true
    immediate_render = false
    fail_timeout = 0
}

background {
    monitor =
    # path = screenshot
    path = /run/media/shush/E/Downloads/Wallpapers/abstract1.jpg
    color = rgba(25, 20, 20, 1.0)

    blur_passes = 2
    blur_size = 10

    noise = 0.0517
    brightness = 1.0
    contrast = 1.0
    vibrancy = 0.2696
    vibrancy_darkness = 0.2696
}

input-field {
    monitor =
    size = 450, 55
    outline_thickness = 0
    dots_size = 0.30
    dots_spacing = 0.40
    dots_center = true
    outer_color = rgba(40,40,40,0.0)
    inner_color = rgba(200, 200, 200, 0.9)
    fail_text = Try again!
    fail_color = rgba(40,40,40,0.0)
    font_color = rgba(10, 10, 10, 0.8)
    fade_on_empty = false
    placeholder_text = Enter Password
    hide_input = false

    position = 0, -320
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi there, $USER
    color = rgba(200, 200, 200, 0.9)
    font_size = 24
    font_family = Noto Sans

    position = 0, -230
    halign = center
    valign = center
}

label {
    monitor =
    text = $FAIL
    color = rgba(200, 200, 200, 0.9)
    font_size = 24
    font_family = Noto Sans

    position = 0, -400
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date '+%H:%M')</span>"
    color = rgba(250, 250, 250, 0.8)
    font_size = 110
    font_family = Noto Sans

    position = 0, 320
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgb(10,10,10)
    shadow_boost = 1
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date '+%A, %d %B')</span>"
    # text = cmd[update:1000] echo "<span foreground='##eeeeee'>$(date '+%A, %d %B')</span>"
    color = rgba(255, 255, 255, 1)
    font_size = 20
    font_family = Noto Sans

    position = 0, 220
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgb(10,10,10)
    shadow_boost = 0.6
}
